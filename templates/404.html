<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short URL Not Found | Shortly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <a href="/" class="brand-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                <span>Shortly</span>
            </a>
        </header>

        <main class="main-content">
            <div class="card error-card">
                <div class="error-badge">404 Error</div>
                <h1 class="error-title">Short URL not found</h1>
                <p class="error-description">The short link you clicked or entered does not exist or may have been removed.</p>
                <div class="error-action">
                    <a href="/" class="btn btn-primary">Return to Home</a>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p>Built with Python + Flask + SQLite</p>
        </footer>
    </div>
</body>
</html>
